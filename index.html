<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>不動產及估價法規 - 全法規與技術公報知識庫</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="不動產及估價法規">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/app.css?v=1.2.6">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-brand" id="btnHome">
      <button class="btn-icon" id="btnToggleSidebar" aria-label="切換法規清單" title="切換法規清單">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <img src="./icons/icon-192.png" alt="Logo" width="28" height="28" style="border-radius: 6px;">
      <span class="brand-title">不動產及估價法規</span>
    </div>

    <!-- Desktop Navigation Tabs (Visible on screens >= 768px) -->
    <nav class="header-nav" id="headerNav">
      <button class="nav-tab-btn header-tab-btn active" data-view="reader" title="54 部估價母法子法全文">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>法規條文</span>
        <span class="nav-count-badge">54</span>
      </button>
      <button class="nav-tab-btn header-tab-btn" data-view="bulletins" title="中華民國估價師公會全聯會 15 號技術公報">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>公會公報</span>
        <span class="nav-count-badge">15</span>
      </button>
      <button class="nav-tab-btn header-tab-btn" data-view="bookmarks" title="我的法條收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>我的收藏</span>
        <span class="nav-count-badge bookmark-count-badge">0</span>
      </button>
    </nav>

    <div class="header-actions">
      <button class="btn-icon" id="btnFontToggle" title="調整字體大小" aria-label="調整字體大小">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19L10 5L16 19"></path>
          <line x1="6" y1="14" x2="14" y2="14"></line>
          <path d="M18 13L20 9L22 13"></path>
          <line x1="18.5" y1="12" x2="21.5" y2="12"></line>
        </svg>
      </button>
      <button class="btn-icon" id="btnThemeToggle" title="切換夜間模式" aria-label="切換夜間模式">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Top Audio Player Bar (Embedded under Header) -->
  <div class="audio-player-bar" id="audioPlayerBar">
    <div class="player-info">
      <span class="pulse-dot"></span>
      <span id="playerTitle">正在朗讀：第 1 條</span>
      <span id="wakeLockBadge" class="wakelock-badge" title="螢幕常亮已開啟：朗讀時手機不會自動休眠黑屏" style="display:none;">🔆常亮</span>
    </div>
    <div class="player-controls">
      <button class="btn-player" id="btnPlayerToggle" title="暫停/播放" aria-label="暫停/播放">⏸</button>
      <button class="btn-player" id="btnPlayerNext" title="朗讀下一條" aria-label="朗讀下一條">⏭</button>
      <button class="btn-player" id="btnPlayerVoice" title="切換發音人聲/音色" aria-label="切換發音人聲/音色">🗣️</button>
      <button class="btn-player" id="btnPlayerSpeed" title="切換語速" aria-label="切換語速">1.0x</button>
      <button class="btn-player-close" id="btnPlayerClose" title="停止朗讀" aria-label="停止朗讀">✕</button>
    </div>
  </div>

  <!-- Main Container -->
  <div class="app-container">
    
    <!-- Sidebar Backdrop for Mobile -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Left Sidebar: Search, Mode & Catalog -->
    <aside class="sidebar" id="sidebar">
      <!-- Search Input -->
      <div class="sidebar-search-box">
        <div class="search-input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="搜尋法規、條號或公報..." autocomplete="off">
        </div>
      </div>

      <!-- Sidebar Mode Switcher -->
      <div class="sidebar-mode-bar" id="sidebarModeBar">
        <button class="sidebar-mode-btn active" data-view="reader">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span>法規庫 (54)</span>
        </button>
        <button class="sidebar-mode-btn" data-view="bulletins">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span>公會公報 (15)</span>
        </button>
      </div>

      <!-- Categories Filter -->
      <div class="sidebar-categories" id="categoryContainer"></div>

      <!-- Laws List -->
      <div class="law-list" id="lawListContainer"></div>

      <!-- Bulletins Sidebar List -->
      <div class="bulletins-sidebar-list" id="bulletinsSidebarContainer" style="display: none;"></div>
    </aside>

    <!-- Main Content Reader Pane -->
    <main class="main-content" id="mainContent">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        正在載入法規資料庫...
      </div>
    </main>

  </div>

  <!-- Mobile Floating Action Button (Quick Jump) -->
  <button class="fab-jump" id="fabJump" aria-label="條號快速直達" title="條號直達">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <polyline points="13 17 18 12 13 7"></polyline>
      <polyline points="6 17 11 12 6 7"></polyline>
    </svg>
  </button>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="bottom-nav-bar" id="bottomNav">
    <button class="nav-tab-btn active" data-view="reader">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>法規目錄</span>
    </button>
    <button class="nav-tab-btn" data-view="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>搜尋檢索</span>
    </button>
    <button class="nav-tab-btn" data-view="bulletins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>公會公報</span>
    </button>
    <button class="nav-tab-btn" data-view="bookmarks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>我的收藏</span>
    </button>
  </nav>

  <!-- Cross-reference / Quick Jump Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">法條參照</h3>
        <button class="btn-icon" id="modalCloseBtn" aria-label="關閉">✕</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast">已複製引用格式</div>

  <!-- Scripts -->
  <script src="./js/search.js?v=1.2.0"></script>
  <script src="./js/tts.js?v=1.2.0"></script>
  <script src="./js/app.js?v=1.2.0"></script>
</body>
</html>
